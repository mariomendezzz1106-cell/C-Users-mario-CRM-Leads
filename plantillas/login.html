<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · CRM de Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='acceso.css') }}">
</head>
<body>
<main>
  <div>
    <h1>CRM de Leads</h1>
    <p>Inicia sesión para ver los datos de tu empresa.</p>
  </div>
  {% if aviso %}<div class="ok" role="status">{{ aviso }}</div>{% endif %}
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('auth.login_post') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Email<input name="email" type="email" autocomplete="username" value="{{ email }}" required autofocus></label>
    <label>Contraseña<input name="clave" type="password" autocomplete="current-password" required></label>
    <button type="submit">Entrar</button>
  </form>
  {% if permitir_registro %}<p>¿Tu empresa aún no tiene cuenta? <a href="{{ url_for('auth.registro') }}">Crear cuenta</a></p>{% endif %}
</main>
</body>
</html>
